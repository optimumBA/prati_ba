apiVersion: apps/v1
kind: Deployment
metadata:
  name: pratiba
spec:
  replicas: 1
  strategy:
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    spec:
      containers:
        - name: pratiba
          env:
            - name: ASSET_HOST
              value: static-staging-2345.prati.ba
            - name: AWS_S3_BUCKET
              value: staging-static.prati.ba
            - name: HOST
              value: staging-2345.prati.ba
            - name: POOL_SIZE
              value: "2"
            - name: PROXY_CIDR
              value: 34.120.208.18/32
