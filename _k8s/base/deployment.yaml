apiVersion: apps/v1
kind: Deployment
metadata:
  name: pratiba
spec:
  selector:
  strategy:
    type: RollingUpdate
  template:
    spec:
      containers:
        - name: pratiba
          image: gcr.io/pratiba/pratiba
          ports:
            - name: http
              containerPort: 4000
          # startupProbe:
          #   httpGet:
          #     path: /health
          #     port: 4000
          #   periodSeconds: 5
          #   failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
          # readinessProbe:
          #   httpGet:
          #     path: /health
          #     port: 4000
          #   periodSeconds: 5
          #   failureThreshold: 3
