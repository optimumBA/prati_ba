apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: pratiba
    env: staging
  name: pratiba
  namespace: staging
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pratiba
      env: staging
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: pratiba
        env: staging
    spec:
      containers:
        - image: gcr.io/pratiba/pratiba
          name: pratiba-staging
          env:
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: admin-password
                  key: value
            - name: AWS_S3_ID
              valueFrom:
                secretKeyRef:
                  name: aws-s3-id
                  key: value
            - name: AWS_S3_SECRET
              valueFrom:
                secretKeyRef:
                  name: aws-s3-secret
                  key: value
            - name: ASSET_HOST
              value: static-staging-2345.prati.ba
            - name: AWS_S3_BUCKET
              value: staging-static.prati.ba
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: database-url
                  key: value
            - name: ERLANG_COOKIE
              valueFrom:
                secretKeyRef:
                  name: erlang-cookie
                  key: value
            - name: HOST
              value: staging-2345.prati.ba
            - name: MAXMIND_LICENSE_KEY
              valueFrom:
                secretKeyRef:
                  name: maxmind-license-key
                  key: value
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: POOL_SIZE
              value: "2"
            - name: SECRET_KEY_BASE
              valueFrom:
                secretKeyRef:
                  name: secret-key-base
                  key: value
          livenessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 60
            timeoutSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 60
            timeoutSeconds: 15
          ports:
            - name: http
              containerPort: 4000
      imagePullSecrets:
        - name: aws-ecr-credentials
