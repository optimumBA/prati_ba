# fly.toml file generated for prati-ba on 2022-08-23T14:19:21+02:00
app = "prati-ba"
kill_signal = "SIGTERM"
kill_timeout = 5
primary_region = "fra"
processes = []

[deploy]
release_command = "/app/bin/migrate"

[env]
PORT = "8080"

[experimental]
allowed_public_ports = []
auto_rollback = true

[mounts]
destination = "/data"
source = "pratiba_data"

[[services]]
http_checks = []
internal_port = 8080
processes = ["app"]
protocol = "tcp"
script_checks = []

[services.concurrency]
hard_limit = 25
soft_limit = 20
type = "connections"

[[services.ports]]
force_https = true
handlers = ["http"]
port = 80

[[services.ports]]
handlers = ["tls", "http"]
port = 443

[[services.tcp_checks]]
grace_period = "1s"
interval = "15s"
restart_limit = 0
timeout = "2s"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024
